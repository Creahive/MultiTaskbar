name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin/MultiTaskbar.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MultiTaskbar.exe" | Set-Content bin/SHA256SUMS.txt -NoNewline
          Get-Content bin/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MultiTaskbar
          path: |
            bin/MultiTaskbar.exe
            bin/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/MultiTaskbar.exe
            bin/SHA256SUMS.txt
          generate_release_notes: true
